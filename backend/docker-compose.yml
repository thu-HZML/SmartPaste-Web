version: '3.8'

services:
  web:
    build: .  
    container_name: smartpaste_django
    restart: always
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "8000"
    environment:
      - DJANGO_DEBUG=False               
      - DJANGO_ALLOWED_HOSTS=*           
      - MYSQL_HOST=db                    
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=smartpaste_db
      - MYSQL_USER=smartpaste_user
      - MYSQL_PASSWORD=smartpaste_pass
      - CORS_ALLOW_ALL_ORIGINS=True
    depends_on:
      - db

  nginx:
    image: nginx:1.21-alpine
    container_name: smartpaste_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web

  db:
    image: mysql:8.0
    container_name: smartpaste_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smartpaste_db
      MYSQL_USER: smartpaste_user
      MYSQL_PASSWORD: smartpaste_pass
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
  static_volume:
  media_volume: